# Application Core & Server Configuration
spring.application.name=TechCoach.io
server.port=${PORT:8081}

# PostgreSQL Database Connection & Hibernate ORM Settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# JSON Web Token (JWT) Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

# External AI Service Integration Key
gemini.api.key=${GEMINI_API_KEY}

# Spring Security OAuth2 Google Social Login Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email

# Client Application URL for CORS and Redirect Handling
frontend.url=${FRONTEND_URL:http://localhost:5173}
